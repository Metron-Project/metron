repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/djlint/djLint
    rev: v1.54.0
    hooks:
      - id: djlint-reformat-django
        # wiki/ and django_nyt/ are vendored third-party apps.
        exclude: ^(wiki|django_nyt)/
#      - id: djlint-django
