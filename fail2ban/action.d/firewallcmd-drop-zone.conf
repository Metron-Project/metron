[Definition]
# Ban IPs by adding them to the "f2b-metron" firewalld ipset, which is bound to
# the drop zone as a single source (one-time setup: see "Ban ipset setup" in
# DEPLOYMENT.md).
#
# Why the drop zone: it matches sources before DNAT port forwarding, so it works
# when firewalld forwards 80/443 to unprivileged ports (8080/8443). The
# firewallcmd-rich-rules action targets the INPUT chain, which DNAT bypasses.
#
# Why an ipset instead of `--zone=drop --add-source=<ip>`: each zone source makes
# firewalld generate its own rules in several chains. With ~140 banned IPs,
# firewalld 2.4 (nftables backend) pegged a CPU core and grew to GBs of memory at
# startup, and each fail2ban "Restore Ban" took ~20 s, which left the site
# unreachable after a reboot. An ipset entry is a single nftables set element.
#
# Why no --permanent: fail2ban restores active bans from its own database on
# start. Permanent entries are only removed if fail2ban is running when the ban
# expires, so they pile up across restarts.
#
# Runtime ipset entries are lost on `firewall-cmd --reload` or a firewalld
# restart. Run `systemctl restart fail2ban` afterwards to re-apply active bans.

actionstart =

actionstop =

actioncheck =

actionban = firewall-cmd --ipset=f2b-metron --add-entry=<ip>
            conntrack -D -s <ip> || true

actionunban = firewall-cmd --ipset=f2b-metron --remove-entry=<ip>
