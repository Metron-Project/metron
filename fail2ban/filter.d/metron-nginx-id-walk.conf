[Definition]
# Ban IPs that walk legacy numeric issue URLs. Only 302 (passed Anubis) and 429
# (hit the nginx id_walk cap) count, so crawlers that Anubis answers with a 200
# challenge or deny page are not banned. /series/<int>/ is left out because real
# users browse it.
failregex = ^<HOST> \S+ \S+ \[.*?\] "GET /issue/\d+/? HTTP/[\d.]+" (?:302|429)\b
ignoreregex =
