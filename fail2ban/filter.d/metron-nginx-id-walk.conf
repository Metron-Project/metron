[Definition]
# Ban IPs that walk legacy numeric issue/series URLs. Only 302 (passed Anubis) and
# 429 (hit the nginx id_walk cap) count, so crawlers that Anubis answers with a
# 200 challenge or deny page are not banned.
failregex = ^<HOST> \S+ \S+ \[.*?\] "GET /(?:issue|series)/\d+/? HTTP/[\d.]+" (?:302|429)
ignoreregex =
