[Definition]
# Ban IPs that repeatedly trigger HTTP 403 (Forbidden) from nginx.
# Matches the standard nginx combined log format logged via journald.
failregex = ^<HOST> \S+ \S+ \[.*?\] ".*?" 403\b
# Lookup widget searches are excluded: a session that expires mid-form gets a 403 for each search.
ignoreregex = ^\S+ \S+ \S+ \[.*?\] "[A-Z]+ /izaya/\S* HTTP/[\d.]+" 403\b
