{% load i18n %}
{% for team in teams %}
    {% include "comicsdb/partials/thumbnail_link_card.html" with obj=team detail_url_name="team:detail" crop="center" %}
{% endfor %}
<div id="teams-load-more-wrapper"
     class="has-text-centered mt-4"
     hx-swap-oob="true">
    {% if has_more %}
        <button class="button is-link"
                hx-get="{% url 'issue:teams-load-more' issue_slug %}?offset={{ next_offset }}"
                hx-target="#teams-container"
                hx-swap="beforeend"
                hx-indicator="#teams-spinner">
            <span>{% trans "Load More Teams" %}</span>
        </button>
        <span id="teams-spinner" class="htmx-indicator ml-2">
            <i class="fas fa-spinner fa-spin"></i>
        </span>
    {% endif %}
</div>
