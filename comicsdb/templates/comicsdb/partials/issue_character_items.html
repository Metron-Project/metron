{% load i18n %}
{% for character in characters %}
    {% include "comicsdb/partials/thumbnail_link_card.html" with obj=character detail_url_name="character:detail" crop="top" %}
{% endfor %}
<div id="characters-load-more-wrapper"
     class="has-text-centered mt-4"
     hx-swap-oob="true">
    {% if has_more %}
        <button class="button is-link"
                hx-get="{% url 'issue:characters-load-more' issue_slug %}?offset={{ next_offset }}"
                hx-target="#characters-container"
                hx-swap="beforeend"
                hx-indicator="#characters-spinner">
            <span>{% trans "Load More Characters" %}</span>
        </button>
        <span id="characters-spinner" class="htmx-indicator ml-2">
            <i class="fas fa-spinner fa-spin"></i>
        </span>
    {% endif %}
</div>
