{% load i18n %}
{% for universe in universes %}
    {% include "comicsdb/partials/thumbnail_link_card.html" with obj=universe detail_url_name="universe:detail" crop="center" %}
{% endfor %}
<div id="universes-load-more-wrapper"
     class="has-text-centered mt-4"
     hx-swap-oob="true">
    {% if has_more %}
        <button class="button is-link"
                hx-get="{% url 'issue:universes-load-more' issue_slug %}?offset={{ next_offset }}"
                hx-target="#universes-container"
                hx-swap="beforeend"
                hx-indicator="#universes-spinner">
            <span>{% trans "Load More Universes" %}</span>
        </button>
        <span id="universes-spinner" class="htmx-indicator ml-2">
            <i class="fas fa-spinner fa-spin"></i>
        </span>
    {% endif %}
</div>
