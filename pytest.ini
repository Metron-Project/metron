[pytest]
DJANGO_SETTINGS_MODULE=metron.settings
python_files = tests.py test_*.py
# Run in parallel using all available CPUs. --reuse-db skips rebuilding the test
# database (~103 migrations, per xdist worker) on every run; safe in CI too since
# each job starts from a fresh Postgres container. After changing a migration
# locally, run once with --create-db to force a rebuild.
addopts=-n auto -ra --strict-config --strict-markers --reuse-db --cov --cov-report=html --cov-report=term